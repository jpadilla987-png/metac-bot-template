name: NIGHTEYE Policy Guard CI

on:
  push:
    branches: [main]
    paths:
      - "policy_guard.py"
      - "test_policy_guard.py"
      - "main.py"
      - ".github/workflows/policy_guard_ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run zero-dependency policy tests
        run: python -m unittest -v test_policy_guard.py
      - name: Compile guarded entrypoint
        run: python -m py_compile main.py policy_guard.py
