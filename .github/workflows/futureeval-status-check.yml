name: FutureEval Registration Status Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/futureeval-status-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check authenticated Fall FutureEval tournament state and public form link
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python - <<'PY'
          import html, json, os, re, urllib.request, urllib.error
          token = os.environ.get("METACULUS_TOKEN")
          if not token:
              raise SystemExit("METACULUS_TOKEN missing")

          def get(url, auth=False):
              headers={"Accept":"application/json,text/html;q=0.9","User-Agent":"futureeval-status-check/1.1"}
              if auth:
                  headers["Authorization"] = f"Token {token}"
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode("utf-8","replace")

          status, body = get("https://www.metaculus.com/api/projects/tournaments/fall-futureeval-2026/", True)
          data = json.loads(body)
          keys = [
              "id", "slug", "name", "user_permission", "default_permission",
              "is_subscribed", "has_participated", "bot_leaderboard_status",
              "is_ongoing", "start_date", "close_date"
          ]
          print("TOURNAMENT_HTTP", status)
          print("TOURNAMENT_STATE", json.dumps({k:data.get(k) for k in keys}, sort_keys=True))

          page_urls = [
              "https://www.metaculus.com/notebooks/38928/futureeval-resources-page/",
              "https://www.metaculus.com/notebooks/38928/docs.adj.news",
              "https://www.metaculus.com/notebooks/45615/announcement-of-futureeval-fall-2026/",
          ]
          candidates=set()
          for page_url in page_urls:
              try:
                  pstatus, text = get(page_url)
              except Exception as e:
                  print("PAGE_ERROR", page_url, type(e).__name__, str(e)[:200])
                  continue
              print("PAGE_HTTP", pstatus, page_url)
              low=text.lower()
              idx=low.find("participation form")
              if idx >= 0:
                  snippet=re.sub(r"\s+"," ",html.unescape(text[max(0,idx-500):idx+1000]))
                  print("PARTICIPATION_SNIPPET", snippet[:1500])
              for m in re.finditer(r'href=["\']([^"\']+)["\']', text, flags=re.I):
                  href=html.unescape(m.group(1))
                  h=href.lower()
                  if any(x in h for x in ("forms.gle","docs.google.com/forms","airtable","tally.so","coda.io","typeform","form")):
                      candidates.add(href)
          print("FORM_LINK_CANDIDATES", json.dumps(sorted(candidates)))
          form_url="https://forms.gle/aQdYMq9Pisrf1v7d8"
          try:
              fstatus, fhtml = get(form_url)
              print("FORM_HTTP", fstatus)
              print("FORM_FINAL_BYTES", len(fhtml))
              clean=html.unescape(re.sub(r"<[^>]+>"," ",fhtml))
              clean=re.sub(r"\\s+"," ",clean)
              for needle in ("llm credit","credit","required","bot","name","email","organization","affiliation","motivation"):
                  idx=clean.lower().find(needle)
                  if idx >= 0:
                      print("FORM_TEXT", needle, clean[max(0,idx-300):idx+900])
          except Exception as e:
              print("FORM_FETCH_ERROR", type(e).__name__, str(e)[:500])
          PY
