name: FutureEval Registration Status Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/futureeval-status-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check authenticated Fall FutureEval tournament state
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get("METACULUS_TOKEN")
          if not token:
              raise SystemExit("METACULUS_TOKEN missing")
          url = "https://www.metaculus.com/api/projects/tournaments/fall-futureeval-2026/"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Token {token}",
              "Accept": "application/json",
              "User-Agent": "futureeval-status-check/1.0",
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
                  print("HTTP", r.status)
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
              print(e.read().decode("utf-8", "replace")[:1000])
              raise
          keys = [
              "id", "slug", "name", "user_permission", "default_permission",
              "is_subscribed", "has_participated", "bot_leaderboard_status",
              "is_ongoing", "start_date", "close_date"
          ]
          print(json.dumps({k: data.get(k) for k in keys}, sort_keys=True))
          PY
